{% extends 'base.html' %}
{% load static %}

{% block title %}{{ post.title }} | Minimalist Blog{% endblock %}

{% block content %}
<article class="post-detail">
    <header class="post-header animate-scale delay-1">
        <h1 class="post-title">{{ post.title }}</h1>
        <p class="post-meta">Published on {{ post.created_at|date:"F j, Y" }}</p>
    </header>

    {% if post.cover_image %}
    <div class="post-hero-image animate-scale delay-2">
        <img src="{{ post.cover_image.url }}" alt="{{ post.title }}">
    </div>
    {% endif %}

    <div class="post-body animate-scale delay-3">
        {{ post.content|linebreaks }}
    </div>
    
    <div class="post-footer animate-scale delay-4">
        <a href="{% url 'post_list' %}" class="back-link">&larr; Back to Home</a>
    </div>
</article>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
            }
        });
    }, { threshold: 0.1 });
    
    document.querySelectorAll('.animate-scale').forEach((el) => {
        observer.observe(el);
    });
});
</script>
{% endblock %}
